id = "linnovs/grok-usage"
name = "Grok Usage"
version = "1.4.2"
plugin_api = 42
author = "Linnovs"
license = "MIT"
dependencies = []
tags = ["bar", "panel", "ai", "utility"]
icon = "sparkles"
description = "Shows today's paced Grok budget on the bar, with left-today and the full cycle breakdown in an attached panel."

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 15
min = 1
max = 1440

[[widget]]
id = "usage"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 320
height = "content"
max_height = 560
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true

[[service]]
id = "sync"
entry = "service.luau"
